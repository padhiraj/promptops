- description: g05
  vars:
    question: Which form does a new supplier submit to register?
    context: '[supplier_onboarding#1] Registration and compliance

      - New suppliers submit registration form SUP-01.

      - Compliance check: a valid ISO 9001 certificate and GST registration are mandatory.

      - Financial review: the supplier''s credit score must be at least 650.


      [supplier_onboarding#3] Approval and payment

      - The Procurement Head gives final approval.

      - Standard payment terms are net 45 days.

      - Suppliers are reviewed every quarter using a scorecard.


      [ai_usage_policy#3] Reporting and maintenance

      - Report wrong or unsafe AI outputs with form AI-FB-01 within 2 working days.

      - The AI Enablement team reviews the prompt library every month.'
  assert:
  - type: icontains-any
    value:
    - SUP-01
- description: g06
  vars:
    question: What is the minimum credit score required for a new supplier?
    context: '[supplier_onboarding#1] Registration and compliance

      - New suppliers submit registration form SUP-01.

      - Compliance check: a valid ISO 9001 certificate and GST registration are mandatory.

      - Financial review: the supplier''s credit score must be at least 650.


      [quality_inspection#1] Sampling and acceptance

      - Inspect a sample of 10% of each lot, with a minimum of 5 units.

      - A lot is rejected if the defect rate is above 2%.


      [supplier_onboarding#3] Approval and payment

      - The Procurement Head gives final approval.

      - Standard payment terms are net 45 days.

      - Suppliers are reviewed every quarter using a scorecard.'
