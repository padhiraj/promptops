- description: g01
  vars:
    question: How long is the battery warranty?
    context: '[warranty_claims#1] Coverage

      - Battery warranty: 8 years or 80,000 km, whichever comes first.

      - Vehicle warranty: 3 years or 30,000 km, whichever comes first.

      - Not covered: tyres, brake pads and bulbs, because they are wear items.


      [warranty_claims#3] Approval

      - The Warranty Desk gives a decision within 5 working days.

      - Claims above ₹50,000 need approval from the Regional Manager.


      [battery_safety#1] Storage

      - Store battery packs at 15°C to 30°C with humidity of at most 70%.

      - A storage bay holds a maximum of 20 packs.

      - Store packs at a 40% to 60% state of charge.'
  assert:
  - type: icontains-any
    value:
    - 8 years
  - type: icontains-any
    value:
    - 80,000 km
- description: g02
  vars:
    question: Within how many days must a warranty claim be filed?
    context: '[warranty_claims#2] Filing a claim

